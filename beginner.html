<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beginner Tutorials</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Beginner Crochet Tutorials</h1>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <section>
    <h2>Basics</h2>
    <ul>
      <li>Basic Chain</li>
      <li>Single Crochet</li>
      <li>Double Crochet</li>
      <li>Half Double Crochet</li>
      <li>Treble Crochet</li>
    </ul>

    <h3>Enter Yarn & Hook Details</h3>
    <form onsubmit="suggestPattern(event)">
      <label for="yarn">Yarn Strands:</label>
      <input type="number" id="yarn" placeholder="e.g. 2, 4">

      <label for="hook">Hook Size (mm):</label>
      <input type="number" id="hook" placeholder="e.g. 3.5">

      <button type="submit">Get AI Suggestion</button>
    </form>

    <div id="patternResult"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
