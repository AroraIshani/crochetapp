<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crochet App - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🧶 Crochet Application</h1>
  </header>

  <section id="login">
    <h2>Login</h2>
    <form onsubmit="loginUser(event)">
      <label for="username">Username:</label>
      <input type="text" id="username" required>
      <button type="submit">Login</button>
    </form>
  </section>

  <section id="level" style="display:none;">
    <h2>Select Your Knowledge Level</h2>
    <button onclick="redirectLevel('beginner.html')">Beginner</button>
    <button onclick="redirectLevel('intermediate.html')">Intermediate</button>
    <button onclick="redirectLevel('pro.html')">Pro</button>
  </section>

  <footer>
    <p>© 2026 Crochet App by Ishani</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
