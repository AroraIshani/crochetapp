<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crochet Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🧶 Crochet Application</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="patterns.html">Patterns</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="chatbot.html">AI Chatbot</a>
    </nav>
  </header>

  <section id="patterns">
    <h2>Pattern Finder</h2>
    <form onsubmit="suggestPattern(event)">
      <label for="yarn">Yarn Type:</label>
      <input type="text" id="yarn" placeholder="e.g. cotton, wool">

      <label for="hook">Hook Size (mm):</label>
      <input type="number" id="hook" placeholder="e.g. 3.5">

      <button type="submit">Find Pattern</button>
    </form>

    <div id="patternResult"></div>
  </section>

  <footer>
    <p>© 2026 Crochet App by Ishani</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
