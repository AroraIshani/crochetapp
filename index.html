<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crochet Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🧶 Crochet Application</h1>
    <nav>
      <a href="#patterns">Patterns</a>
      <a href="#dashboard">Dashboard</a>
      <a href="#chatbot">AI Chatbot</a>
    </nav>
  </header>

  <section id="patterns">
    <h2>Pattern Gallery</h2>
    <div class="card">
      <h3>Floral Granny Square</h3>
      <p>Step-by-step tutorial for beginners.</p>
    </div>
    <div class="card">
      <h3>Phone Sleeve</h3>
      <p>Customizable crochet design.</p>
    </div>
  </section>

  <section id="dashboard">
    <h2>Dashboard</h2>
    <p>Track your progress and completed projects here.</p>
  </section>

  <section id="chatbot">
    <h2>AI Crochet Assistant</h2>
    <button onclick="chat()">Ask for Help</button>
    <div id="chatbox"></div>
  </section>

  <footer>
    <p>© 2026 Crochet App by Ishani</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
